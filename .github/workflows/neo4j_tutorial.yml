name: Neo4j Tutorial

on:
  workflow_dispatch:
  push:
    branches:
      - feature/184661
    paths:
      - "neo4j_tutorial/**"
      - ".github/workflows/neo4j_tutorial.yml"
  pull_request:
    branches:
      - development

jobs:
  neo4j-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j

    defaults:
      run:
        working-directory: neo4j_tutorial

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install neo4j python-dotenv tqdm pandas

      - name: Wait For Neo4j
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:7474 && break
            echo "Esperando a Neo4j..."
            sleep 2
          done

      - name: Test Connection
        run: python conexion.py

      - name: Ingest Football Data
        run: python ingest_football_data.py

      - name: Run Queries
        run: python consultas.py